name: Multiproject Supervisor
on:
  schedule:
    - cron: '3-58/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
  checks: read
concurrency:
  group: multiproject-supervisor
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect configured repositories (read-only)
        env:
          GH_TOKEN: ${{ secrets.SUPERVISOR_GITHUB_TOKEN || github.token }}
        run: node scripts/supervise.mjs
