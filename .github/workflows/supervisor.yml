name: Multiproject Supervisor
on:
  schedule:
    - cron: '3-53/10 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
  checks: read
  actions: read
concurrency:
  group: multiproject-supervisor
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Record trigger evidence
        env:
          RUN_EVENT: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_REPOSITORY: ${{ github.repository }}
        run: |
          {
            echo '### Supervisor execution evidence'
            echo "- Trigger: \`$RUN_EVENT\`"
            echo "- Run: https://github.com/$RUN_REPOSITORY/actions/runs/$RUN_ID"
            echo "- Attempt: $RUN_ATTEMPT"
            echo "- UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            if [ "$RUN_EVENT" = schedule ]; then
              echo '- Scheduled trigger observed: yes'
            else
              echo '- Scheduled trigger observed: no (manual or other event)'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect configured repositories (read-only)
        env:
          GH_TOKEN: ${{ secrets.SUPERVISOR_GITHUB_TOKEN || github.token }}
        run: node scripts/supervise.mjs
