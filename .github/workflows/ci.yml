name: Supervisor CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Run tests
        run: npm test
      - name: Validate workflow syntax (actionlint v1.7.12)
        shell: bash
        run: |
          set -euo pipefail
          archive="actionlint_1.7.12_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error --retry 2 --max-time 30 \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.12/${archive}" \
            --output "${RUNNER_TEMP}/${archive}"
          printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' "${RUNNER_TEMP}/${archive}" | sha256sum --check --status
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" actionlint
          "${RUNNER_TEMP}/actionlint" -shellcheck= -pyflakes= .github/workflows/*.yml
